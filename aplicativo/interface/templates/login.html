<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hospital Geral Rio Negrinho – Login Portal do Paciente</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
  <div class="box">
    <h1>Hospital Geral Rio Negrinho</h1>
    <p>Fazer Login</p>
    <div id="error" role="alert"></div>
    <form action="/Login" method="post">
    <label for="user">Username</label>
    <input name="username" id="user" type="text" autocomplete="username">
    <label for="pass">Password</label>
    <input name="password" id="pass" type="password" autocomplete="current-password">
    <input type="submit" id="btn" value="Confirmar">
    </form>
  </div>
</body>
</html>
